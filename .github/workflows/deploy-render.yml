name: Deploy to Render

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/worker/**
      - packages/**
      - Dockerfile
      - render.yaml
      - package.json

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render Deploy Hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret not set. Skipping deploy hook trigger (auto-deploy from repo will execute)."
            exit 0
          fi
          curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Render deploy hook triggered."

      - name: Wait for Cloud Service Startup
        run: sleep 40

      - name: Verify Live Health Endpoint
        run: |
          WORKER_URL="${{ secrets.WORKER_API_URL || 'https://wp-9.onrender.com' }}"
          echo "Checking $WORKER_URL/health/live..."
          curl -fsSL "$WORKER_URL/health/live" || exit 1
