# ==============================================================================
# WP-9 Production Always-Live Architecture: WhatsApp AI CRM Platform
# Stack: Caddy (TLS) + Baileys/Evolution + Node Worker + Next.js + PostgreSQL +
#        Redis (BullMQ) + Qdrant (RAG) + n8n + Uptime Kuma (Self-Healing)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Reverse Proxy & Automatic SSL/TLS (Caddy)
  # ----------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: wp9_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - worker
      - web
    networks:
      - wp9_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 2. WhatsApp Engine & AI Orchestration Worker (Baileys Primary)
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wp9_worker
    restart: unless-stopped
    ports:
      - "8788:8788"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - WORKER_PORT=8788
      - BAILEYS_AUTH_DIR=/app/data/baileys-auth
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-wp9}
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - worker_auth:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8788/health/live"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - wp9_network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # 3. Next.js CRM & Management Web Dashboard
  # ----------------------------------------------------------------------------
  web:
    image: node:22-bookworm-slim
    container_name: wp9_web
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run build:web && npm run start -w web"
    ports:
      - "43217:43217"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=43217
      - WORKER_API_URL=http://worker:8788
      - NEXT_PUBLIC_WORKER_API_URL=http://worker:8788
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/.next
    depends_on:
      - worker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:43217/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - wp9_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 4. Primary Relational CRM Database (PostgreSQL 16)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: wp9_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-wp9}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-wp9}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wp9_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 5. High-Speed Cache, Sessions & BullMQ Queue Broker (Redis 7)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: wp9_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wp9_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 6. Vector Database for RAG & Knowledge Embeddings (Qdrant)
  # ----------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: wp9_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - wp9_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 7. Workflow Automation Brain (n8n)
  # ----------------------------------------------------------------------------
  n8n:
    image: n8nio/n8n:latest
    container_name: wp9_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}
      - NODE_ENV=production
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-wp9}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-postgres}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wp9_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 8. 24/7 Self-Healing & Uptime Monitoring Dashboard (Uptime Kuma)
  # ----------------------------------------------------------------------------
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: wp9_uptime_kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - wp9_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 9. Evolution API Gateway (Optional Alternate WhatsApp Engine Profile)
  # Run with: docker compose --profile evolution up -d
  # ----------------------------------------------------------------------------
  evolution-api:
    image: atendai/evolution-api:v2.1.2
    container_name: wp9_evolution_api
    restart: unless-stopped
    profiles:
      - evolution
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://evolution-api:8080
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-wp9_evolution_secret_key}
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-wp9}?sslmode=disable
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=http://worker:8788/webhook/evolution
      - DEL_INSTANCE=false
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wp9_network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # 9. Container Image Update Notifier (Diun)
  # ----------------------------------------------------------------------------
  diun:
    image: crazymax/diun:latest
    container_name: wp9_diun
    restart: unless-stopped
    profiles:
      - updates
    volumes:
      - "./data/diun:/data"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    environment:
      - "TZ=Asia/Kolkata"
      - "LOG_LEVEL=info"
      - "DIUN_WATCH_WORKERS=5"
      - "DIUN_WATCH_SCHEDULE=0 0 * * *"
      - "DIUN_PROVIDERS_DOCKER=true"
    networks:
      - wp9_network

# ------------------------------------------------------------------------------
# Persistent Docker Volumes
# ------------------------------------------------------------------------------
volumes:
  worker_auth:
  postgres_data:
  redis_data:
  qdrant_data:
  n8n_data:
  uptime_kuma_data:
  caddy_data:
  caddy_config:
  evolution_instances:

# ------------------------------------------------------------------------------
# Internal Bridge Network
# ------------------------------------------------------------------------------
networks:
  wp9_network:
    driver: bridge
