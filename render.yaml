services:
  - type: web
    name: wp9-worker
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: 8788
      - key: WORKER_PORT
        value: 8788
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: WORKER_API_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
