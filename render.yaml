services:
  - type: web
    name: wp9-worker
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: Dockerfile
    healthCheckPath: /health/live
    disk:
      name: wp9-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DEPLOYMENT_MODE
        value: render
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: WORKER_API_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
