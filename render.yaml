services:
  - type: web
    name: whatsapp-baileys-worker
    runtime: docker
    dockerfilePath: Dockerfile
    plan: starter
    healthCheckPath: /health/live
    envVars:
      - key: WORKER_PORT
        value: "8788"
      - key: BAILEYS_AUTH_DIR
        value: /app/data/baileys-auth
    disk:
      name: baileys-auth
      mountPath: /app/data
      sizeGB: 1
