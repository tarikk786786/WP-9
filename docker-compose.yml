services:
  worker:
    build: .
    ports:
      - "8788:8788"
    env_file:
      - .env
    volumes:
      - worker-auth:/app/data
    environment:
      BAILEYS_AUTH_DIR: /app/data/baileys-auth
    restart: unless-stopped

  web:
    image: node:22-bookworm-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev:web"
    ports:
      - "43217:43217"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - worker
    environment:
      WORKER_API_URL: http://worker:8788
    restart: unless-stopped

volumes:
  worker-auth:
