app = "wp9-worker"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8788"
  WORKER_PORT = "8788"

[[services]]
  protocol = "tcp"
  internal_port = 8788

  [[services.ports]]
    port = 80
    handlers = ["http"]
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "20s"
    grace_period = "15s"
    method = "get"
    path = "/health/live"
    protocol = "http"
    timeout = "5s"
