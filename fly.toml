# Persistent Baileys worker — one machine, never auto-stop.
app = "whatsapp-baileys-worker"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  WORKER_PORT = "8788"
  BAILEYS_AUTH_DIR = "/app/data/baileys-auth"

[http_service]
  internal_port = 8788
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "20s"
    timeout = "5s"
    grace_period = "25s"
    method = "GET"
    path = "/health/live"

[mounts]
  source = "baileys_data"
  destination = "/app/data"
